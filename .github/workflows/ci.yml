name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: objetheque
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: objetheque/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: objetheque/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    - run: pnpm lint:ci
    - run: pnpm format:check
    - run: pnpm type-check
    - run: pnpm build-only